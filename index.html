        // Data simulation system
        class DataSimulator {
            constructor() {
                this.dataSources = {
                    temperature: () => 15 + Math.sin(Date.now() / 10000) * 10 + Math.random() * 5,
                    weather: () => ({
                        humidity: 40 + Math.random() * 40,
                        wind_speed: Math.random() * 25,
                        pressure: 1000 + Math.random() * 50
                    }),
                    seismic: () => Math.random() * 3,
                    social_media: () => (Math.random() - 0.5) * 2, // sentiment -1 to 1
                    physics: () => 9.81 + (Math.random() - 0.5) * 0.1,
                    market: () => Math.random() * 100,
                    fitness: () => 75 + Math.random() * 25,
                    transportation: () => 30 + Math.random() * 70,
                    surveillance: () => Math.random() * 100,
                    power_grid: () => 1000 + Math.random() * 500,
                    solar: () => 800 + Math.random() * 400,
                    astronomical: () => Math.random(), // lunar phase 0-1
                    environmental: () => 2 + Math.random() * 3,
                    wildlife: () => 50 + Math.random() * 100,
                    atomic_clock: () => 1 + (Math.random() - 0.5) * 0.000001,
                    gps: () => 1 + Math.random() * 10, // meters accuracy
                    network: () => 100 + Math.random() * 900, // Mbps
                    database: () => Math.random() * 10,
                    space: () => 2.7 + Math.random() * 0.3, // cosmic background radiation
                    random: () => Math.random(),
                    energy: () => 1000 + Math.random() * 2000
                };
                this.cache = {};
                this.lastUpdate = {};
            }

            getData(source, field) {
                const now = Date.now();
                const cacheKey = `${source}_${field}`;
                
                if (!this.lastUpdate[cacheKey] || now - this.lastUpdate[cacheKey] > 1000) {
                    const sourceData = this.dataSources[source]();
                    this.cache[cacheKey] = typeof sourceData === 'object' ? sourceData[field] || sourceData : sourceData;
                    this.lastUpdate[cacheKey] = now;
                }
                
                return this.cache[cacheKey];
            }
        }

        // Power evolution system
        class PowerEvolution {
            constructor() {
                this.behaviorTracker = {};
                this.actionHistory = [];
                this.evolutionThresholds = {
                    level2: 50,
                    level3: 150,
                    level4: 300,
                    level5: 500
                };
            }

            trackAction(action, context = {}) {
                this.actionHistory.push({
                    action,
                    context,
                    timestamp: Date.now()
                });

                // Keep only recent actions
                if (this.actionHistory.length > 1000) {
                    this.actionHistory = this.actionHistory.slice(-500);
                }

                this.analyzeBehaviorPatterns();
            }

            analyzeBehaviorPatterns() {
                const recentActions = this.actionHistory.slice(-50);
                const patterns = {};

                // Analyze movement patterns
                const movements = recentActions.filter(a => a.action === 'move');
                if (movements.length > 10) {
                    const avgSpeed = movements.reduce((sum, m) => sum + (m.context.speed || 0), 0) / movements.length;
                    patterns.movement_speed = avgSpeed > 5 ? 'fast' : avgSpeed > 2 ? 'moderate' : 'slow';
                    
                    // Check for circular patterns
                    const positions = movements.map(m => ({ x: m.context.x, y: m.context.y }));
                    patterns.movement_pattern = this.detectCircularMovement(positions) ? 'circular' : 'linear';
                }

                // Analyze power usage
                const powerUses = recentActions.filter(a => a.action === 'use_power');
                patterns.power_frequency = powerUses.length > 20 ? 'frequent' : powerUses.length > 5 ? 'moderate' : 'rare';

                // Analyze interaction patterns
                const interactions = recentActions.filter(a => a.action === 'interact');
                patterns.interaction_style = interactions.length > 15 ? 'social' : interactions.length > 5 ? 'selective' : 'solitary';

                this.behaviorTracker = { ...this.behaviorTracker, ...patterns };
                this.checkEvolution();
            }

            detectCircularMovement(positions) {
                if (positions.length < 10) return false;
                
                const center = {
                    x: positions.reduce((sum, p) => sum + p.x, 0) / positions.length,
                    y: positions.reduce((sum, p) => sum + p.y, 0) / positions.length
                };

                const distances = positions.map(p => 
                    Math.sqrt((p.x - center.x) ** 2 + (p.y - center.y) ** 2)
                );

                const avgDistance = distances.reduce((sum, d) => sum + d, 0) / distances.length;
                const variance = distances.reduce((sum, d) => sum + (d - avgDistance) ** 2, 0) / distances.length;
                
                return variance < avgDistance * 0.3; // Low variance indicates circular movement
            }

            checkEvolution() {
                const currentPower = game.currentPower;
                if (!currentPower) return;

                const actionCount = this.actionHistory.length;
                const currentLevel = currentPower.level || 1;

                // Check if we should evolve
                for (const [levelName, threshold] of Object.entries(this.evolutionThresholds)) {
                    const level = parseInt(levelName.replace('level', ''));
                    if (level > currentLevel && actionCount >= threshold) {
                        this.evolvePower(level);
                        break;
                    }
                }
            }

            evolvePower(newLevel) {
                const power = game.currentPower;
                if (!power) return;

                power.level = newLevel;
                
                // Add new abilities based on behavior patterns
                const behaviors = this.behaviorTracker;
                const powerData = SUPERPOWERS[power.id];
                
                if (powerData.evolution) {
                    // Select evolution based on behavior
                    let evolutionKey = Object.keys(powerData.evolution)[0]; // default
                    
                    if (behaviors.movement_speed === 'fast' && powerData.evolution.speed_enhancement) {
                        evolutionKey = 'speed_enhancement';
                    } else if (behaviors.power_frequency === 'frequent' && powerData.evolution.power_amplification) {
                        evolutionKey = 'power_amplification';
                    } else if (behaviors.interaction_style === 'social' && powerData.evolution.collective_consciousness) {
                        evolutionKey = 'collective_consciousness';
                    }

                    power.evolutions = power.evolutions || [];
                    if (!power.evolutions.includes(evolutionKey)) {
                        power.evolutions.push(evolutionKey);
                        
                        // Add new visual effects for evolution
                        power.visualEffects = power.visualEffects || [powerData.visualEffect];
                        power.visualEffects.push(powerData.evolution[evolutionKey]);
                        
                        this.logEvolution(power.name, evolutionKey, powerData.evolution[evolutionKey]);
                    }
                }

                this.savePowerData();
            }

            logEvolution(powerName, evolutionKey, description) {
                const logElement = document.getElementById('actionsLog');
                const entry = document.createElement('div');
                entry.className = 'log-entry power-evolution';
                entry.textContent = `🌟 ${powerName} evolved: ${description}`;
                logElement.appendChild(entry);
                
                // Keep log manageable
                while (logElement.children.length > 10) {
                    logElement.removeChild(logElement.firstChild);
                }
            }

            savePowerData() {
                localStorage.setItem('pixelPowerData', JSON.stringify({
                    currentPower: game.currentPower,
                    behaviorTracker: this.behaviorTracker,
                    actionHistory: this.actionHistory.slice(-100) // Save recent history
                }));
            }

            loadPowerData() {
                const saved = localStorage.getItem('pixelPowerData');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.behaviorTracker = data.behaviorTracker || {};
                    this.actionHistory = data.actionHistory || [];
                    return data.currentPower;
                }
                return null;
            }
        }

        // Visual effects system
        class VisualEffects {
            constructor(ctx) {
                this.ctx = ctx;
                this.particles = [];
            }

            async generatePowerEffect(power, x, y, intensity = 1) {
                const powerData = SUPERPOWERS[power.id];
                if (!powerData) return;

                // Generate visual description for AI
                const prompt = `${powerData.visualEffect} emanating from position, intensity ${intensity}, magical pixel art style`;
                
                try {
                    // Create particle effect based on power
                    this.createParticleEffect(power, x, y, intensity);
                    
                    // Optionally generate AI image for special effects
                    if (intensity > 2) {
                        const result = await websim.imageGen({
                            prompt: prompt,
                            aspect_ratio: "1:1",
                            transparent: true
                        });
                        // Could overlay generated effect image
                    }
                } catch (error) {
                    console.log('Visual effect generated without AI enhancement');
                    this.createParticleEffect(power, x, y, intensity);
                }
            }

            createParticleEffect(power, x, y, intensity) {
                const powerData = SUPERPOWERS[power.id];
                const color = powerData.color;
                const count = Math.floor(10 * intensity);

                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x + (Math.random() - 0.5) * 20,
                        y: y + (Math.random() - 0.5) * 20,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        color: color,
                        life: 1.0,
                        maxLife: 60,
                        size: 2 + Math.random() * 3,
                        type: power.id
                    });
                }
            }

            updateParticles() {
                this.particles = this.particles.filter(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life -= 1/particle.maxLife;
                    
                    if (particle.life <= 0) return false;

                    // Draw particle
                    this.ctx.save();
                    this.ctx.globalAlpha = particle.life;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.fillRect(
                        Math.floor(particle.x - game.camera.x), 
                        Math.floor(particle.y - game.camera.y), 
                        particle.size, 
                        particle.size
                    );
                    this.ctx.restore();
                    
                    return true;
                });
            }
        }

        // Game initialization
        function initGame() {
            game.canvas = document.getElementById('gameCanvas');
            game.ctx = game.canvas.getContext('2d');
            
            // Set canvas size
            game.canvas.width = window.innerWidth;
            game.canvas.height = window.innerHeight;
            
            // Initialize systems
            game.dataSimulator = new DataSimulator();
            game.powerEvolution = new PowerEvolution();
            game.visualEffects = new VisualEffects(game.ctx);
            
            // Load or assign power
            initializePower();
            
            // Set up event listeners
            setupEventListeners();
            
            // Start game loop
            gameLoop();
            
            // Update UI periodically
            setInterval(updateUI, 1000);
        }

        function initializePower() {
            // Try to load existing power
            const savedPower = game.powerEvolution.loadPowerData();
            
            if (savedPower) {
                game.currentPower = savedPower;
            } else {
                // Assign random power
                const powerKeys = Object.keys(SUPERPOWERS);
                const randomKey = powerKeys[Math.floor(Math.random() * powerKeys.length)];
                const powerData = SUPERPOWERS[randomKey];
                
                game.currentPower = {
                    id: randomKey,
                    name: powerData.name,
                    level: 1,
                    evolutions: [],
                    visualEffects: [powerData.visualEffect],
                    assignedAt: Date.now()
                };
                
                game.powerEvolution.savePowerData();
            }
            
            updatePowerDisplay();
        }

        function updatePowerDisplay() {
            const power = game.currentPower;
            if (!power) return;
            
            document.getElementById('powerName').textContent = power.name;
            document.getElementById('powerLevel').textContent = `Level ${power.level}`;
            
            // Update evolution hints
            const powerData = SUPERPOWERS[power.id];
            const hints = powerData.behaviors.join(', ');
            document.getElementById('evolutionHints').textContent = 
                `Evolution hints: ${hints}`;
        }

        function updateUI() {
            const power = game.currentPower;
            if (!power) return;
            
            const powerData = SUPERPOWERS[power.id];
            const dataValue = game.dataSimulator.getData(powerData.dataSource, powerData.baseDataPoint);
            
            let displayValue = dataValue;
            if (typeof dataValue === 'number') {
                displayValue = dataValue.toFixed(2);
            }
            
            document.getElementById('currentData').innerHTML = 
                `<strong>${powerData.baseDataPoint}:</strong> ${displayValue}`;
        }

        function setupEventListeners() {
            // Keyboard events
            document.addEventListener('keydown', (e) => {
                game.keys[e.code] = true;
                
                if (e.code === 'Space') {
                    e.preventDefault();
                    usePowerSpecial();
                }
            });
            
            document.addEventListener('keyup', (e) => {
                game.keys[e.code] = false;
            });
            
            // Mouse events
            game.canvas.addEventListener('mousemove', (e) => {
                const rect = game.canvas.getBoundingClientRect();
                game.mouse.x = e.clientX - rect.left + game.camera.x;
                game.mouse.y = e.clientY - rect.top + game.camera.y;
            });
            
            game.canvas.addEventListener('click', (e) => {
                game.mouse.clicked = true;
                usePower(game.mouse.x, game.mouse.y);
            });
            
            // Window resize
            window.addEventListener('resize', () => {
                game.canvas.width = window.innerWidth;
                game.canvas.height = window.innerHeight;
            });
        }

        function usePower(x, y) {
            const power = game.currentPower;
            if (!power) return;
            
            // Track action for evolution
            game.powerEvolution.trackAction('use_power', {
                x: x,
                y: y,
                powerLevel: power.level,
                timestamp: Date.now()
            });
            
            // Calculate intensity based on data
            const powerData = SUPERPOWERS[power.id];
            const dataValue = game.dataSimulator.getData(powerData.dataSource, powerData.baseDataPoint);
            const intensity = Math.max(0.5, Math.min(3, dataValue / 50));
            
            // Create visual effect
            game.visualEffects.generatePowerEffect(power, x, y, intensity);
            
            // Log action
            logAction(`Used ${power.name} (Intensity: ${intensity.toFixed(1)})`);
        }

        function usePowerSpecial() {
            const power = game.currentPower;
            if (!power) return;
            
            // Special ability based on power level and evolutions
            const intensity = power.level + power.evolutions.length;
            game.visualEffects.generatePowerEffect(
                power, 
                game.player.x, 
                game.player.y, 
                intensity
            );
            
            logAction(`${power.name} Special Activated!`);
        }

        function logAction(text) {
            const logElement = document.getElementById('actionsLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = text;
            logElement.appendChild(entry);
            
            while (logElement.children.length > 8) {
                logElement.removeChild(logElement.firstChild);
            }
        }

        function updatePlayer() {
            const speed = game.player.speed;
            let moved = false;
            
            if (game.keys['KeyW'] || game.keys['ArrowUp']) {
                game.player.y -= speed;
                moved = true;
            }
            if (game.keys['KeyS'] || game.keys['ArrowDown']) {
                game.player.y += speed;
                moved = true;
            }
            if (game.keys['KeyA'] || game.keys['ArrowLeft']) {
                game.player.x -= speed;
                moved = true;
            }
            if (game.keys['KeyD'] || game.keys['ArrowRight']) {
                game.player.x += speed;
                moved = true;
            }
            
            if (moved) {
                game.powerEvolution.trackAction('move', {
                    x: game.player.x,
                    y: game.player.y,
                    speed: speed
                });
            }
            
            // Update camera to follow player
            game.camera.x = game.player.x - game.canvas.width / 2;
            game.camera.y = game.player.y - game.canvas.height / 2;
        }

        function render() {
            const ctx = game.ctx;
            
            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, game.canvas.width, game.canvas.height);
            
            // Draw simple grid for infinite world feel
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1;
            
            const gridSize = 50;
            const startX = Math.floor(game.camera.x / gridSize) * gridSize;
            const startY = Math.floor(game.camera.y / gridSize) * gridSize;
            
            for (let x = startX; x < game.camera.x + game.canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x - game.camera.x, 0);
                ctx.lineTo(x - game.camera.x, game.canvas.height);
                ctx.stroke();
            }
            
            for (let y = startY; y < game.camera.y + game.canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y - game.camera.y);
                ctx.lineTo(game.canvas.width, y - game.camera.y);
                ctx.stroke();
            }
            
            // Draw player
            ctx.fillStyle = game.player.color;
            ctx.fillRect(
                game.player.x - game.camera.x - game.player.size/2,
                game.player.y - game.camera.y - game.player.size/2,
                game.player.size,
                game.player.size
            );
            
            // Draw power aura around player
            if (game.currentPower) {
                const powerData = SUPERPOWERS[game.currentPower.id];
                ctx.save();
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = powerData.color;
                ctx.fillRect(
                    game.player.x - game.camera.x - game.player.size,
                    game.player.y - game.camera.y - game.player.size,
                    game.player.size * 2,
                    game.player.size * 2
                );
                ctx.restore();
            }
            
            // Update and draw visual effects
            game.visualEffects.updateParticles();
        }

        function gameLoop() {
            updatePlayer();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start the game when page loads
        window.addEventListener('load', initGame);
    </script>
